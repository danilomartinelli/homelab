# Hermes Agent — official image, pinned tag.
#
# Every value here was read off `docker image inspect`, the image's own
# entrypoint scripts, and a live probe of `gateway run` — not assumed. The
# assumptions that verification disproved, kept as a record:
#
#   HERMES_HOME is /opt/data, NOT /home/hermes/.hermes. The image declares
#   /opt/data as its volume and sets HERMES_WRITE_SAFE_ROOT to match.
#
#   `init: true` is actively harmful. entrypoint-dispatch.sh delegates to
#   s6-overlay's /init only when it is PID 1; Docker's own init takes that
#   slot and the script falls back to an unsupervised path, printing
#   "Supervised services are unavailable in this runtime". The image
#   supervises main-hermes, dashboard, user and user2.
#
#   `--user <uid>` is rejected by design. main-wrapper.sh fails fast on any
#   non-root, non-hermes UID because the baked image directories are owned by
#   the build UID. The container starts root and drops to `hermes` via
#   s6-setuidgid on its own.
#
#   Running with NO command is a restart loop, not a daemon. main-wrapper.sh
#   routes "no args" to bare `hermes`, which is the interactive CLI; with no
#   TTY it reads EOF, prints "Goodbye!" and exits 0. Docker's
#   `restart: unless-stopped` then restarts it forever — observed
#   RestartCount climbing 3 -> 4 in twelve seconds while `docker ps` still
#   reported "(healthy)".
#
#   `hermes --version` is a worthless healthcheck for exactly that reason: it
#   proves the binary exists, not that the agent runs. It reported healthy
#   throughout the restart loop.
#
# ORDERING CONSTRAINT — this stack cannot start before WhatsApp is paired.
# A live probe of `gateway run` with no channel configured logs
# "No messaging platforms enabled" and exits 0, which is the same restart
# loop by a different route. Pair first (see README), then start the unit.
#
# Playwright ships in the image (PLAYWRIGHT_BROWSERS_PATH=/opt/hermes/
# .playwright) but only as chromium_headless_shell, which renders nothing a
# human can watch. Live observation is why hermes-chromium exists separately.
services:
  hermes:
    # The stable v2026.8.3 image ships seven high-severity npm advisories.
    # Upstream main removed the root/agent-browser advisory but its lockfile
    # still pins two build-only copies of nanoid 3.3.17 (GHSA-2v37-7h3g-55p8).
    #
    # Pin the tested upstream amd64 digest, then apply the smallest possible
    # lockfile bump. `npm audit fix` is deliberately not used: npm's arborist
    # crashes or expands the vulnerable workspace tree on this monorepo.
    # Verified against this exact build on 2026-08-20:
    #   npm audit --workspaces=false  -> 0
    #   npm audit --workspace web     -> 0
    #   npm audit --workspace ui-tui  -> 0
    #   npm run build --workspace web -> pass
    #   npm run build --workspace ui-tui -> pass
    image: homelab/hermes-agent:2026-09-08-opencode-session
    build:
      dockerfile_inline: |
        FROM nousresearch/hermes-agent@sha256:76401214cc3771504c62a59932a40d21cd22bb4953ea4b00758b5742180dbf97
        WORKDIR /opt/hermes
        RUN sed -i \
              -e 's#3.3.17#3.3.18#g' \
              -e 's#nanoid/-/nanoid-3.3.17.tgz#nanoid/-/nanoid-3.3.18.tgz#g' \
              -e 's#sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g==#sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w==#g' \
              package-lock.json \
            && npm ci --ignore-scripts --no-audit --no-fund \
            && uv pip install --python /opt/hermes/.venv/bin/python \
              "faster-whisper==1.2.1" \
              "ctranslate2==4.8.1"

        # Backport upstream PR #101864 without changing the base image or STT.
        # OpenCode Go rejects requests without a stable x-opencode-session.
        # Pin both the upstream commit and patch contents; fail on source drift.
        ADD --checksum=sha256:48d3af9e2b452f1cbae8ed96cdc1021a6b31f71846fe1a929c8333167d19ebf3 \
            https://github.com/NousResearch/hermes-agent/commit/c9e2075c14233e8503552984d80a9e86d596b6cb.diff \
            /tmp/opencode-session.diff
        RUN git apply --include='agent/auxiliary_client.py' \
              --include='agent/opencode_affinity.py' \
              --include='tests/agent/test_opencode_session_affinity.py' \
              /tmp/opencode-session.diff \
            && rm /tmp/opencode-session.diff
        # Adapt imports and the main-call entry point to 0.20.4. Its ambient
        # conversation context already preserves affinity across compression.
        RUN /opt/hermes/.venv/bin/python - <<'PY'
        from pathlib import Path
        path = Path("agent/opencode_affinity.py")
        source = path.read_text()
        replacements = {
            'from hermes_cli.models import opencode_provider_family\n\n        if opencode_provider_family(provider) is not None:': 'if provider in {"opencode-go", "opencode-zen", "opencode-free"}:',
            "from agent.anthropic_endpoints import": "from agent.anthropic_adapter import",
            "import get_affinity_scope, get_conversation_context": "import get_conversation_context",
            "get_affinity_scope() or get_conversation_context()": "get_conversation_context()",
        }
        for old, new in replacements.items():
            if source.count(old) != 1:
                raise SystemExit("Unexpected upstream OpenCode affinity helper")
            source = source.replace(old, new, 1)
        compile(source, str(path), "exec")
        path.write_text(source)

        path = Path("agent/chat_completion_helpers.py")
        source = path.read_text()
        signature = "def build_api_kwargs(agent, api_messages: list, tools_for_api: list | None = None) -> dict:"
        if source.count(signature) != 1:
            raise SystemExit("Unexpected Hermes build_api_kwargs entry point")
        wrapper = '''def build_api_kwargs(agent, api_messages: list, tools_for_api: list | None = None) -> dict:
            """Attach the OpenCode session header on every main-call transport."""
            from agent.opencode_affinity import merge_opencode_session_headers

            return merge_opencode_session_headers(
                _build_api_kwargs_for_mode(agent, api_messages, tools_for_api),
                getattr(agent, "provider", None),
                getattr(agent, "base_url", None),
                getattr(agent, "session_id", None),
            )


        '''
        source = source.replace(signature, wrapper + signature.replace("build_api_kwargs", "_build_api_kwargs_for_mode"), 1)
        compile(source, str(path), "exec")
        path.write_text(source)

        from agent.opencode_affinity import opencode_session_headers
        for provider, url in (("opencode-go", None), ("custom", "https://opencode.ai/zen/go/v1")):
            if opencode_session_headers(provider, url, "build-check") != {"x-opencode-session": "build-check"}:
                raise SystemExit("OpenCode session header backport is not functional")
        PY
    container_name: hermes
    restart: unless-stopped

    # host networking so the agent reaches the sibling Chromium's CDP socket
    # on 127.0.0.1:9222 without a bridge, and so tailnet names resolve as
    # they do on the host.
    network_mode: host

    # The messaging gateway: WhatsApp, Telegram, Discord, plus the cron
    # scheduler. `run` keeps it in the foreground, which the subcommand's own
    # help recommends for Docker.
    command: ["gateway", "run"]

    # API keys from sops: /run/secrets/hermes/env, plain KEY=VALUE, mode 0440
    # group keys so the docker daemon can read it and users cannot.
    env_file:
      # Model provider keys.
      - /run/secrets/hermes/env
      # The WhatsApp Cloud provider values and allowed-user restriction. Split
      # into its own secret so the systemd unit can gate startup on path
      # existence:
      # `gateway run` exits 0 when no messaging platform is configured, and
      # Docker's restart policy turns that into a silent loop. Keeping the
      # WhatsApp credentials in a separate file gives systemd a startup
      # precondition; ConditionPathExists does not validate secret contents.
      - /run/secrets/hermes/whatsapp-cloud-env

    environment:
      # HOME is /opt/data for the runtime user. Keep its user-local bin first
      # so both interactive shells and subprocesses resolve the declaratively
      # managed hermes symlink below.
      PATH: "/opt/data/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games"

      # Point the browser toolset at the sibling container's CDP endpoint
      # rather than the bundled headless shell, so sessions are observable.
      #
      # Port 9223, not 9222: Chromium refuses to bind CDP anywhere but its
      # own container loopback, so a socat sidecar in the Chromium network
      # namespace forwards 9223 -> 127.0.0.1:9222. The Chromium stack
      # publishes 9223 on the host's loopback, and 127.0.0.1 resolves to the
      # host here because this container uses host networking.
      #
      # If this container ever leaves host networking, this needs to become
      # host.docker.internal (plus an extra_hosts entry) or both stacks need
      # to share a bridge network.
      HERMES_BROWSER_CDP_URL: "http://127.0.0.1:9223"
      TZ: "America/Sao_Paulo"

      # WhatsApp Cloud API webhook. Keep this listener contract synchronized
      # with services/uncloud/Caddyfile and the callback URL documented in the
      # repository README. Keep the listener port synchronized with the Caddy
      # upstream and the firewall permission in modules/ingress.nix. These are
      # bind settings, not provider secrets.
      # Values read out of
      # gateway/platforms/whatsapp_cloud.py rather than guessed:
      # DEFAULT_WEBHOOK_PORT = 8090, DEFAULT_WEBHOOK_PATH =
      # "/whatsapp/webhook", DEFAULT_WEBHOOK_HOST = None.
      #
      # HOST is pinned to the gateway of kodo's Uncloud bridge. The
      # Uncloud-managed Caddy container reaches the host at 10.210.0.1, but
      # the webhook is not bound to the public or Tailscale interfaces. The
      # default of None would bind every interface and expose 8090 directly.
      WHATSAPP_CLOUD_WEBHOOK_HOST: "10.210.0.1"
      WHATSAPP_CLOUD_WEBHOOK_PORT: "8090"
      WHATSAPP_CLOUD_WEBHOOK_PATH: "/whatsapp/webhook"

    volumes:
      # The image's declared volume. Holds config.yaml, auth.json (Codex
      # OAuth), sessions, memories, skills, and the Baileys WhatsApp session
      # — everything that must survive replacing the container.
      - /var/lib/homelab/hermes/data:/opt/data

      # Read-only server policy, materialised by Nix from the tracked config.
      # Hermes deep-merges it over /opt/data/config.yaml at runtime.
      - /etc/hermes:/etc/hermes:ro

    healthcheck:
      # Test the thing that actually matters: the gateway process is alive.
      # Anything that merely invokes the CLI passes even mid-restart-loop.
      test: ["CMD-SHELL", "pgrep -f 'gateway run' >/dev/null && /opt/hermes/.venv/bin/python -c 'import faster_whisper' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
