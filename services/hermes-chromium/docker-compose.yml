# Chromium with a watchable session, for observing what the agent does.
#
# Values verified against `docker image inspect` and the image's own
# /defaults/autostart rather than assumed. The corrections inspection
# forced, recorded so they are not reintroduced:
#
#   Ports are 3000 (HTTP) and 3001 (HTTPS) — NOT 6080. The image exposes
#   exactly those two.
#
#   Extra Chromium flags go through the CHROME_CLI environment variable.
#   /defaults/autostart is literally `wrapped-chromium ${CHROME_CLI}`, so a
#   compose-level `command:` would replace the s6 entrypoint instead of
#   reaching Chromium, and the browser would never start.
#
#   The volume is /config, and PUID/PGID own it.
#
# Why this exists at all: the Hermes image already bundles Playwright, but
# only chromium_headless_shell, which renders nothing a human can watch.
# This stack runs a real Chromium under a virtual display with a noVNC
# front-end, so the same browser Hermes drives over CDP is visible in a
# browser tab.
#
# Exposure: network_mode host binds 3000/3001/9222 on all interfaces. The
# firewall in modules/networking.nix does not open them, so the only path in
# is Tailscale (trustedInterfaces includes tailscale0) — reachable at
# kodo.zubron-palermo.ts.net:3000 from any device on the tailnet, and closed
# to the public internet. Do not add these ports to allowedTCPPorts: an
# unauthenticated Chromium on the open internet is a remote code execution
# primitive, and CDP has no authentication whatsoever.
services:
  chromium:
    image: ghcr.io/linuxserver/chromium:latest
    container_name: hermes-chromium
    restart: unless-stopped
    network_mode: host

    security_opt:
      - seccomp:unconfined
    # Chromium exhausts the default 64 MB /dev/shm and crashes tabs.
    shm_size: "2gb"

    environment:
      PUID: "0"
      PGID: "0"
      TZ: "America/Sao_Paulo"
      TITLE: "kodo — agent browser"
      # CDP on loopback for Hermes, plus the flags a containerised Chromium
      # needs. --remote-allow-origins is required or CDP rejects the
      # WebSocket upgrade from a non-browser client.
      CHROME_CLI: >-
        --remote-debugging-port=9222
        --remote-debugging-address=127.0.0.1
        --remote-allow-origins=*
        --no-first-run
        --no-default-browser-check
        --disable-dev-shm-usage

    volumes:
      # Chromium profile, extensions and noVNC state.
      - /var/lib/homelab/hermes/chromium-config:/config
      # Shared download directory so files the agent fetches are reachable
      # from the Hermes side without a second copy.
      - /var/lib/homelab/hermes/data/downloads:/config/Downloads

    healthcheck:
      # Ask CDP itself, not the web UI: this is the endpoint Hermes depends
      # on, and it answers only once Chromium is actually up.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 45s
